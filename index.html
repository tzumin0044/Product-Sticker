<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品規貼-風間、森森系列使用</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --accent: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 24px;
            color: var(--primary);
            font-weight: 700;
        }

        .date-picker {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-picker label {
            font-weight: 500;
        }

        input[type="date"],
        input[type="text"],
        input[type="number"] {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            height: fit-content;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-search {
            width: 100%;
            margin-bottom: 15px;
        }

        .item-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .item-card {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-card:hover {
            background-color: var(--accent);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .item-info .code {
            font-size: 12px;
            color: #64748b;
            display: block;
        }

        .item-info .name {
            font-weight: 500;
        }

        .unit-tag {
            font-size: 12px;
            background: #dbeafe;
            color: #1e40af;
            padding: 2px 8px;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px;
            background: var(--accent);
            font-weight: 600;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .btn-remove {
            color: #ef4444;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 18px;
        }

        .print-actions {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-clear {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #fee2e2;
            background-color: #fff1f2;
            color: #e11d48;
        }

        .btn-clear:hover {
            background-color: #ffe4e6;
            border-color: #fda4af;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .input-value {
            width: 100px;
        }

        .input-qty {
            width: 80px;
        }

        @media print {
            @page {
                size: 35mm 25mm;
                margin: 0;
            }

            .no-print {
                display: none !important;
            }

            .print-only {
                display: block !important;
            }

            body {
                padding: 0;
                margin: 0;
                background: white;
            }

            .sticker {
                width: 35mm;
                height: 25mm;
                padding: 1.5mm 2mm;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                justify-content: space-around;
                page-break-after: always;
                overflow: hidden;
                font-family: 'Noto Sans TC', sans-serif;
                color: black;
            }

            .sticker-title {
                font-size: 12px;
                font-weight: 700;
                text-align: center;
                letter-spacing: 0.5px;
            }

            .sticker-row {
                font-size: 11px;
                line-height: 1.2;
                display: flex;
                align-items: flex-start;
            }

            .sticker-label {
                font-weight: 500;
                flex-shrink: 0;
            }
        }

        .print-only {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <header class="no-print">
            <h1>品規貼 - 風間、森森系列使用</h1>
            <div class="date-picker">
                <label for="ship-date">出貨日期：</label>
                <input type="date" id="ship-date">
                <button class="btn btn-primary" onclick="handlePrint()" style="margin-left: 10px;">
                    <span style="margin-right: 5px;">🖨️</span> 開始列印
                </button>
            </div>
        </header>

        <main class="main-layout no-print">
            <aside class="panel">
                <div class="panel-title">
                    品項清單
                    <span style="font-size: 12px; font-weight: normal; color: #64748b;">點擊加入</span>
                </div>
                <input type="text" id="item-search" class="item-search" placeholder="搜尋品項或代碼...">
                <div class="item-list" id="preset-items">
                </div>
            </aside>

            <section class="panel">
                <div class="panel-title">
                    <span>待列印清單</span>
                    <div>
                        <button class="btn-clear" style="border-color: #10b981; background-color: #ecfdf5; color: #047857; margin-right: 10px;" onclick="addCustomItem()">+ 自訂品項</button>
                        <button class="btn-clear" onclick="clearAll()">全部刪除</button>
                    </div>
                </div>
                <div id="print-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>品項內容</th>
                                <th>重量</th>
                                <th>單位</th>
                                <th>列印張數</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="print-items">
                        </tbody>
                    </table>
                    <div id="empty-msg" class="empty-state">
                        尚未選取品項，請從左側清單點擊加入
                    </div>
                </div>

            </section>
        </main>
        <div id="print-area" class="print-only"></div>
    </div>

    <script>
        const presetData = [
            { id: "A010B0101", name: "香菇 [ 中 ]", defaultWeight: "3", unit: "KG" },
            { id: "A020A0101", name: "杏鮑菇A", defaultWeight: "1", unit: "KG" },
            { id: "A020B0101", name: "杏鮑菇B", defaultWeight: "3", unit: "KG" },
            { id: "A020C1101", name: "杏鮑菇小C", defaultWeight: "1", unit: "KG" },
            { id: "A06000304", name: "好菇道有機鴻喜菇", defaultWeight: "", unit: "包" },
            { id: "A140A0101", name: "鮑魚菇A", defaultWeight: "1", unit: "600g/包" },
            { id: "A15000101", name: "好菇道舞菇", defaultWeight: "", unit: "100g/包" },
            { id: "E040B0101", name: "櫛瓜M", defaultWeight: "", unit: "KG" },
            { id: "E040C0101", name: "櫛瓜S", defaultWeight: "", unit: "KG" },
            { id: "J02000101", name: "青蔥", defaultWeight: "1", unit: "KG" },
            { id: "L030A0102", name: "日本山藥 [ 4L ]", defaultWeight: "1", unit: "支" }
        ];

        const dateInput = document.getElementById('ship-date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;

        const presetItemsContainer = document.getElementById('preset-items');
        const searchInput = document.getElementById('item-search');

        function renderPresetList(filter = '') {
            presetItemsContainer.innerHTML = '';
            const filtered = presetData.filter(item =>
                item.name.includes(filter) || item.id.includes(filter)
            );

            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item-card';
                div.innerHTML = `
                    <div class="item-info">
                        <span class="code">${item.id}</span>
                        <span class="name">${item.name}</span>
                    </div>
                    <span class="unit-tag">${item.unit}</span>
                `;
                div.onclick = () => addToPrintList(item);
                presetItemsContainer.appendChild(div);
            });
        }

        searchInput.oninput = (e) => renderPresetList(e.target.value);

        const printItemsTbody = document.getElementById('print-items');
        const emptyMsg = document.getElementById('empty-msg');

        printItemsTbody.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const targetCell = e.target.closest('td');
                const targetRow = e.target.closest('tr');
                if (targetCell && targetRow && targetCell.cellIndex === 1) {
                    e.preventDefault();
                    const nextRow = targetRow.nextElementSibling;
                    if (nextRow) {
                        const nextInput = nextRow.cells[1].querySelector('input');
                        if (nextInput) {
                            nextInput.focus();
                        }
                    }
                }
            }
        });

        function addToPrintList(item) {
            emptyMsg.style.display = 'none';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div style="font-weight:500;">${item.name}</div>
                    <div style="font-size:11px; color:#64748b;">${item.id}</div>
                </td>
                <td><input type="text" class="input-value" placeholder="輸入規格..." value="${item.defaultWeight || ''}" onfocus="this.select()"></td>
                <td>${item.unit}</td>
                <td><input type="number" class="input-qty" value="1" min="1"></td>
                <td><button class="btn-remove" onclick="this.parentElement.parentElement.remove(); checkEmpty();">✕</button></td>
            `;
            printItemsTbody.appendChild(tr);
        }

        function addCustomItem() {
            emptyMsg.style.display = 'none';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <input type="text" style="width: 100%; margin-bottom: 4px; padding: 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px;" placeholder="品項名稱...">
                    <input type="text" style="width: 100%; font-size: 12px; padding: 4px; border: 1px solid var(--border); border-radius: 4px;" placeholder="品項代碼...">
                </td>
                <td><input type="text" class="input-value" placeholder="輸入規格..." value="" onfocus="this.select()"></td>
                <td><input type="text" class="input-value" style="width: 60px; padding: 6px; border: 1px solid var(--border); border-radius: 4px;" placeholder="單位..." value=""></td>
                <td><input type="number" class="input-qty" value="1" min="1"></td>
                <td><button class="btn-remove" onclick="this.parentElement.parentElement.remove(); checkEmpty();">✕</button></td>
            `;
            printItemsTbody.appendChild(tr);
        }

        function checkEmpty() {
            if (printItemsTbody.children.length === 0) {
                emptyMsg.style.display = 'block';
            }
        }

        function clearAll() {
            if (printItemsTbody.children.length === 0) return;
            if (confirm('確定要清空所有待列印品項嗎？')) {
                printItemsTbody.innerHTML = '';
                checkEmpty();
            }
        }

        function handlePrint() {
            const rows = printItemsTbody.querySelectorAll('tr');
            if (rows.length === 0) {
                alert('請先加入品項');
                return;
            }

            const printArea = document.getElementById('print-area');
            printArea.innerHTML = '';

            const shipDate = document.getElementById('ship-date').value.replace(/-/g, '/');

            rows.forEach(row => {
                const nameNode = row.cells[0].children[0];
                const idNode = row.cells[0].children[1];
                const name = nameNode.tagName === 'INPUT' ? nameNode.value : nameNode.innerText;
                const id = idNode.tagName === 'INPUT' ? idNode.value : idNode.innerText;
                
                const spec = row.cells[1].querySelector('input').value;
                
                const unitNode = row.cells[2].querySelector('input');
                const unit = unitNode ? unitNode.value : row.cells[2].innerText;
                
                const qtyToPrint = parseInt(row.cells[3].querySelector('input').value) || 1;

                let displaySpec = spec + unit;
                // 櫛瓜特殊邏輯: 只要有輸入規格，顯示 [數字]. + 10mm 空格 + KG
                if ((id === "E040B0101" || id === "E040C0101") && spec !== "") {
                    displaySpec = `${spec}.<span style="display:inline-block; width:10mm;"></span>${unit.toUpperCase()}`;
                }

                for (let i = 0; i < qtyToPrint; i++) {
                    const sticker = document.createElement('div');
                    sticker.className = 'sticker';
                    sticker.innerHTML = `
                        <div class="sticker-title">綠園生活有限公司</div>
                        <div class="sticker-row">
                            <span class="sticker-label">品名：</span>
                            <span>${name}</span>
                        </div>
                        <div class="sticker-row">
                            <span class="sticker-label">數量：</span>
                            <span>${displaySpec}</span>
                        </div>
                        <div class="sticker-row">
                            <span class="sticker-label">出貨日期：</span>
                            <span>${shipDate}</span>
                        </div>
                    `;
                    printArea.appendChild(sticker);
                }
            });

            window.print();
        }

        renderPresetList();
    </script>
</body>

</html>
